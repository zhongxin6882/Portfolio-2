  <aside class="contact-preview-controls" aria-label="转场时长预览设置"><label for="contact-transition-effect">切换效果</label><select id="contact-transition-effect"><option value="curl">卷页翻转</option><option value="blinds" selected>横向百叶窗</option></select><label for="contact-transition-duration">转场时长 <output id="contact-transition-value">1.2 秒</output></label><input id="contact-transition-duration" type="range" min="0.4" max="3" step="0.1" value="1.2"></aside>
  <script>
    (() => {
      const video = document.querySelector('.contact-motion');
      const second = document.querySelector('.contact-motion-second');
      const canvas = document.querySelector('.contact-motion-transition');
      const slider = document.getElementById('contact-transition-duration');
      const effect = document.getElementById('contact-transition-effect');
      const label = document.getElementById('contact-transition-value');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      const ctx = canvas.getContext('2d');
      let timer, animation, switched = false;
      slider.addEventListener('input', () => label.textContent = `${Number(slider.value).toFixed(1)} 秒`);
      function frame(source = video) {
        const image = document.createElement('canvas');
        image.width = canvas.width; image.height = canvas.height;
        const context = image.getContext('2d', {willReadFrequently: true});
        context.fillStyle="#ededed"; context.fillRect(0, 0, image.width, image.height);
        const groundOffset = source === video ? image.height * .014 : 0;
        context.drawImage(source, 0, groundOffset, image.width, image.height);
        const pixels = context.getImageData(0, 0, image.width, image.height);
        for (let i = 0; i < pixels.data.length; i += 4) {
          const gray = .2126 * pixels.data[i] + .7152 * pixels.data[i + 1] + .0722 * pixels.data[i + 2];
          const value = Math.min(237, Math.max(0, gray * 1.787 - 35.55));
          pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = value;
        }
        context.putImageData(pixels, 0, 0);
        return image;
      }
      // Two transitions based on the reference: a curling page and horizontal blinds.
      function render(oldFrame, newFrame, progress) {
        const p=progress*progress*(3-2*progress), w=canvas.width, h=canvas.height;
        ctx.clearRect(0,0,w,h);
        if(effect.value==='blinds') {
          const rows=7, columns=40, strip=h/rows, cell=w/columns;
          ctx.fillStyle='#ededed';ctx.fillRect(0,0,w,h);
          for(let column=0;column<columns;column++) {
            const delay=(column/(columns-1))*.56;
            const q=Math.max(0,Math.min(1,(p-delay)/.44));
            const angle=q*Math.PI, scale=Math.abs(Math.cos(angle));
            const x=column*cell, width=Math.min(w-x,cell+.6);
            for(let row=0;row<rows;row++) {
              const y0=row*strip, height=strip*scale;
              if(height<.2) continue;
              const y=y0+(strip-height)/2;
              ctx.drawImage(q<.5?oldFrame:newFrame,x,y0,width,strip,x,y,width,height+.35);
              const shade=Math.sin(angle)*.10;
              if(shade>.001){ctx.fillStyle=`rgba(40,40,40,${shade})`;ctx.fillRect(x,y,width,height);}
            }
          }
        } else {
          ctx.drawImage(newFrame,0,0);
          const edge=w*(1.3-1.6*p), slope=w*.26, fold=Math.min(w*.09,w*p*(1-p)*.5);
          ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(edge+slope,0);ctx.lineTo(edge-slope,h);ctx.lineTo(0,h);ctx.closePath();ctx.clip();ctx.drawImage(oldFrame,0,0);ctx.restore();
          if(fold>1) {ctx.save();ctx.beginPath();ctx.moveTo(edge+slope,0);ctx.lineTo(edge+slope+fold,0);ctx.lineTo(edge-slope+fold,h);ctx.lineTo(edge-slope,h);ctx.closePath();let g=ctx.createLinearGradient(edge-fold,0,edge+fold*2,0);g.addColorStop(0,'#b8b8b8');g.addColorStop(.5,'#f1f1ef');g.addColorStop(1,'#d0d0cd');ctx.fillStyle=g;ctx.fill();ctx.restore();}
        }
      }
      async function switchToSecond() {
        if(switched || reduced.matches || !video.videoWidth) return;
        switched=true;video.pause();
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        const oldFrame=frame(video);
        ctx.drawImage(oldFrame,0,0);canvas.style.transform='none';canvas.classList.add('is-visible');
        if(second.readyState<2) await new Promise(resolve => second.addEventListener('loadeddata',resolve,{once:true}));
        const newFrame=frame(second), duration=Number(slider.value)*1000;
        const start=performance.now();
        function tick(now){
          const progress=Math.min(1,(now-start)/duration);
          render(oldFrame,newFrame,progress);
          if(progress<1) animation=requestAnimationFrame(tick);
          else {
            second.style.visibility='visible';video.style.visibility='hidden';
            second.play().then(()=>canvas.classList.remove('is-visible')).catch(()=>canvas.classList.remove('is-visible'));
          }
        }
        animation=requestAnimationFrame(tick);
      }
      video.addEventListener('timeupdate',()=>{if(video.currentTime>=5) switchToSecond()});
      video.addEventListener('ended',switchToSecond);
      reduced.addEventListener('change', () => {
        clearTimeout(timer);cancelAnimationFrame(animation);canvas.classList.remove('is-visible');video.style.visibility='';
        if(reduced.matches){video.pause();second.pause()}else (switched?second:video).play().catch(()=>{});
      });
      if(reduced.matches){video.pause();second.pause()}
    })();
  </script>
