name: Work release browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/work-ci.yml'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'about/index.html'
      - 'playground.html'
      - 'contact.html'
      - 'fromanother.html'
      - 'favicon.ico'
      - 'favicon.png'
      - 'work.js'
      - 'work.css'
      - 'work-desktop-paper21.js'
      - 'assets/work/**'
      - 'scripts/verify-work-release.mjs'
      - 'scripts/test-work-release.mjs'
      - 'scripts/verify-live-release.mjs'

permissions:
  contents: read

jobs:
  verify-work:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-global-brand.mjs
      - run: node scripts/verify-work-release.mjs
      - name: Browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test desktop paper deck and mobile fallback
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-work-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/Portfolio-2/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-work-release.mjs
