name: Audio waveform regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'brand-motion.js'
      - 'style.css'
      - 'scripts/test-audio-wave.mjs'
      - '.github/workflows/audio-wave-ci.yml'

permissions:
  contents: read

jobs:
  audio-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-global-brand.mjs
      - name: Install Chromium for responsive audio checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check Audio On/Off on all pages and screen sizes
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-audio-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/Portfolio-2/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-audio-wave.mjs
