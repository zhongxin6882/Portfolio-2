name: Remove merged legacy version branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v1-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify retained versions and merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          test "$(gh api "repos/${repo}/git/ref/heads/1.0" --jq '.object.sha')" = '661314ccf2837821130f02d46c665c0a6272728e'
          test "$(gh api "repos/${repo}/git/ref/heads/rollback/pre-1.0-20261023" --jq '.object.sha')" = '5184d8e3161307e475284dbbffc266320226225b'
          for number in 3 4 5 6; do
            test "$(gh api "repos/${repo}/pulls/${number}" --jq '.merged')" = 'true'
          done

      - name: Delete only verified superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branches=(
            '1.1|5184d8e3161307e475284dbbffc266320226225b'
            '1.1-镜像|f8441f55c97c98769416b4f35d8b609d11cc9ae1'
            'codex/mobile-header-contact-20261023|b3c07a2d27dcac1fc21bab019743b91d7260ff7d'
            'feature/mobile-responsive-20261022|aaff12ce7cdadccd800a374715d18483228bcd80'
            'codex/consolidate-v1.0-20261023|30f2b0d26c763f7f009c58717fc9eb06cd977e1a'
          )
          for item in "${branches[@]}"; do
            branch="${item%%|*}"
            expected="${item#*|}"
            actual="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            test "${actual}" = "${expected}"
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
            echo "Deleted verified merged branch: ${branch}"
          done
          cleanup_head="$(gh api "repos/${repo}/pulls/6" --jq '.head.sha')"
          actual="$(gh api "repos/${repo}/git/ref/heads/codex/cleanup-v1-branches-20261023" --jq '.object.sha')"
          test "${actual}" = "${cleanup_head}"
          gh api --method DELETE "repos/${repo}/git/refs/heads/codex/cleanup-v1-branches-20261023"
          echo 'Deleted cleanup PR branch'

      - name: Verify final branch set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort > /tmp/portfolio-branches.txt
          printf '1.0\nmain\nrollback/pre-1.0-20261023\n' | sort > /tmp/portfolio-expected-branches.txt
          diff -u /tmp/portfolio-expected-branches.txt /tmp/portfolio-branches.txt
