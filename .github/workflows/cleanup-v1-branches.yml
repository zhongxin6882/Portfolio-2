name: Prune verified merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v1-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify retained refs and merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          test "$(gh api "repos/${repo}/git/ref/heads/1.0" --jq '.object.sha')" = '38742ea20a6c8aaff846023b7c7061a4490eb110'
          test "$(gh api "repos/${repo}/git/ref/heads/rollback/pre-1.0-20261023" --jq '.object.sha')" = '5184d8e3161307e475284dbbffc266320226225b'
          for number in 7 8 9 10 11 12 13 14 15; do
            test "$(gh api "repos/${repo}/pulls/${number}" --jq '.merged')" = 'true'
          done
          test "$(gh api "repos/${repo}/pulls/14" --jq '.base.ref')" = '1.0'

      - name: Delete only exact verified branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branches=(
            'codex/align-mobile-audio-tests-20261023|8e8205ea4d7bf22d6f3530030d51f9c94f23dddb'
            'codex/mobile-audio-single-line-20261023|fa72499fa825804be98d0dbb4a27ea6b5ffc0256'
            'codex/mobile-spacing-background-20261023|5a29d370089b8a31111404bd187077e774db68e6'
            'codex/work-release-guard-20261024|6b5e049e8f72d5b5ce0fba0804780ddab792913d'
            'feat/playground-scrolltrigger-stagger-20261023|48082b35024ab53cd1268773f603a35a354758dd'
            'fix/audio-wave-compact-20261023|11139aba801e6138828da45928cadb53e9e4e33a'
            'fix/audio-wave-offset-stroke-20261023|6dc02478b7c486c2ebb590a2b4ff5e04ba99ccc9'
            'fix/audio-wave-stroke-1px-20261023|b39b25286f8cd39abca914716d9cfbc038439bce'
            'fix/gsap-audio-wave-20261023|f4db9ec0cd27eeee5b49749d5ae830a59975acd1'
          )
          for item in "${branches[@]}"; do
            branch="${item%%|*}"
            expected="${item#*|}"
            actual="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            test "${actual}" = "${expected}"
          done
          for item in "${branches[@]}"; do
            branch="${item%%|*}"
            expected="${item#*|}"
            actual="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha')"
            test "${actual}" = "${expected}"
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
            echo "Deleted verified merged branch: ${branch}"
          done

      - name: Verify retained branch set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort > /tmp/portfolio-branches.txt
          printf '1.0\nmain\nrollback/pre-1.0-20261023\n' | sort > /tmp/portfolio-expected-branches.txt
          diff -u /tmp/portfolio-expected-branches.txt /tmp/portfolio-branches.txt
