name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify compiled Playground
        run: |
          test -f dist/playground.html
          grep -Eq 'src="/Portfolio-2/assets/playground-[^"]+\.js"' dist/playground.html
          ! grep -q 'src="playground.js"' dist/playground.html
          test -f dist/style.css
          test -f dist/brand.css
          grep -Eq 'href="style.css\?v=[a-f0-9]{12}"' dist/playground.html
          grep -Eq 'href="brand.css\?v=[a-f0-9]{12}"' dist/playground.html
          ! grep -Eq 'href="/Portfolio-2/assets/[^"]+\.css"' dist/playground.html
          grep -Fq '.play-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))' dist/style.css
          ! grep -Eq 'play-card-index|play-card-arrow|<h2>' dist/assets/playground-*.js
          # Regression check: Playground has no orange footer or count caption.
          grep -Fq 'class="playground-body"' dist/playground.html
          ! grep -Fq 'class="play-footer"' dist/playground.html
          ! grep -Fq 'EXPERIMENTS' dist/playground.html
          ! grep -Fq 'AN OPEN SPACE FOR CURIOSITY' dist/playground.html
      - name: Verify global brand on every route
        run: node scripts/verify-global-brand.mjs
      - name: Verify Work and favicon release assets
        run: node scripts/verify-work-release.mjs
      - name: Install Work browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify desktop paper deck and mobile fallback in browser
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-work-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/Portfolio-2/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-work-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the new release is served by GitHub Pages
        run: node scripts/verify-live-release.mjs
