/* eleve / POP ART — fit the full composition on narrow and wide screens. */
.scene { min-height: 0; }
.backdrop { inset: 0; transform: translate3d(var(--bgx,0px),var(--bgy,0px),0) scale(1.015); }

  top: 5.5%; left: 50%; width: max-content; white-space: nowrap;

}

/* V12 — interactive Physics2D-style emitter; preserves the original portrait. */
.bgtype {font-size:clamp(112px,min(21vw,34vh),350px);letter-spacing:-.085em;top:7%;}
.pop-burst{z-index:6;appearance:none;border:0;padding:0;background:transparent;color:inherit;
 cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;
 transition:transform .24s cubic-bezier(.2,.8,.2,1),filter .24s ease;}

#popPhysics{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:7;pointer-events:none;}

(() => {
'use strict';
const canvas=document.getElementById('portrait'),ctx=canvas.getContext('2d',{alpha:true}),scene=document.getElementById('scene'),stage=document.getElementById('experience'),hero=document.getElementById('hero'),midcopy=document.getElementById('midcopy'),fill=document.getElementById('fill'),bg=document.getElementById('backdrop'),motionBtn=document.getElementById('motionBtn');

 const hoverEchoes=[];let lastEchoTime=0;

const personFigure=new Image();

function makePoints(){
  const sw=440,sh=Math.round(sw*personFigure.height/personFigure.width);
  const portraitCanvas=document.createElement('canvas');
  portraitCanvas.width=sw;portraitCanvas.height=sh;
  const pctx=portraitCanvas.getContext('2d',{willReadFrequently:true});
  function imagePixels(image){
    pctx.clearRect(0,0,sw,sh);
    pctx.drawImage(image,0,0,sw,sh);
    return pctx.getImageData(0,0,sw,sh).data;
  }
  const personData=imagePixels(personFigure);
  const boardData=imagePixels(boardFigure);
  seed=0x998AD112;
  const personPoints=[], boardPoints=[];
  function pushPoint(target,x,y,lum,alpha,kind){
    target.push({u:x/sw,v:y/sh,lum,opacity:alpha,x:null,y:null,vx:0,vy:0,
      dx:rand()*2-1,dy:rand()*2-1,r:rand(),phase:rand()*6.283,
      size:rand(),trail:0,board:kind==='board',hand:kind==='hand',wheel:kind==='wheel'});
  }
  // Independent skater layer. The face, extended hand, sneakers and jacket
  // retain their original dark manga particles and original image colors.
  const stride=isMobile?2.35:1.82;
  for(let y=0;y<sh;y+=stride){for(let x=0;x<sw;x+=stride){
    const xx=clamp(Math.floor(x+rand()*1.2),0,sw-1),yy=clamp(Math.floor(y+rand()*1.2),0,sh-1),i=(yy*sw+xx)*4;
    const alpha=personData[i+3]/255;if(alpha<.38)continue;
    const lum=(personData[i]*.2126+personData[i+1]*.7152+personData[i+2]*.0722)/255;
    const hand=xx/sw<.185&&yy/sh>.118&&yy/sh<.24;
    const density=hand?(lum<.40?.96:lum<.65?.47:.13):(lum<.24?.99:lum<.51?.95:lum<.73?.83:.48);
    if(rand()>density)continue;
    pushPoint(personPoints,xx,yy,lum,alpha,hand?'hand':'person');
  }}
  // Retain fine finger details without adding dark specks onto the skateboard.
  for(let y=sh*.118;y<sh*.238;y+=1.13){for(let x=0;x<sw*.177;x+=1.13){
    const xx=Math.floor(x),yy=Math.floor(y),k=(yy*sw+xx)*4;
    const a=personData[k+3]/255;if(a<.32)continue;
    const lum=(personData[k]*.2126+personData[k+1]*.7152+personData[k+2]*.0722)/255;
    if(rand()>(lum<.40?.94:lum<.66?.42:.10))continue;
    pushPoint(personPoints,xx,yy,lum,a,'hand');
  }}
  const original=personPoints.length,extra=isMobile?Math.floor(original*.18):Math.floor(original*.22);
  for(let i=0,tries=0;i<extra&&tries<extra*18;tries++){
    const x=Math.floor(rand()*sw),y=Math.floor(rand()*sh),j=(y*sw+x)*4;
    if(personData[j+3]<180||personData[j]>145||rand()>.8||(x<sw*.19&&y<sh*.25))continue;
    pushPoint(personPoints,x,y,personData[j]/255,personData[j+3]/255,'person');i++;
  }

  // Separate board + wheel layer; sampling never touches the person's shoes,
  // hand, or clothing. Board is a fine soft-grey stipple, not a black block.
  const boardStep=isMobile?1.85:1.48;
  for(let y=0;y<sh;y+=boardStep){for(let x=0;x<sw;x+=boardStep){
    const xx=Math.floor(x),yy=Math.floor(y),i=(yy*sw+xx)*4;
    const a=boardData[i+3]/255;if(a<.25)continue;
    const lum=(boardData[i]*.2126+boardData[i+1]*.7152+boardData[i+2]*.0722)/255;
    const wheel=(xx/sw>.275&&xx/sw<.49&&yy/sh>.86)||(xx/sw>.79&&yy/sh>.78);
    const density=wheel?.90:lum<.78?.70:lum<.88?.56:.38;
    if(rand()>density)continue;
    pushPoint(boardPoints,xx,yy,lum,a,wheel?'wheel':'board');
  }}
  // Supplement the actual wheel rims using the board sprite's own alpha,
  // rather than drawing unrelated black artificial circles.
  const wheelAreas=[[.29,.88,.48,.998],[.79,.80,.94,.94]];
  for(const [u1,v1,u2,v2] of wheelAreas){
    for(let y=Math.floor(sh*v1);y<sh*v2;y+=1.13){for(let x=Math.floor(sw*u1);x<sw*u2;x+=1.13){
      const xx=Math.floor(x),yy=Math.floor(y),i=(yy*sw+xx)*4;
      const a=boardData[i+3]/255;if(a<.26||rand()>.60)continue;
      const lum=(boardData[i]*.2126+boardData[i+1]*.7152+boardData[i+2]*.0722)/255;
      pushPoint(boardPoints,xx,yy,lum,a,'wheel');
    }}
  }
  for(const p of personPoints){
    p.tone=p.lum<.18?0:p.lum<.42?1:p.lum<.68?2:3;
    p.bucket=Math.min(2,Math.floor(p.r*3));
    p.group=12+p.tone*3+p.bucket;
  }
  for(const p of boardPoints){
    // Both layers use exactly the same four particle inks. The board sprite
    // was deliberately brightened in V8/V9 (most values lie between .67–.94),
    // so re-map that source luminance to the *person's* ink scale. Otherwise
    // the same RGB palette still produces a visibly washed-out skateboard.
    const normalizedInk=clamp((p.lum-.69)/.40);
    p.tone=normalizedInk<.18?0:normalizedInk<.42?1:normalizedInk<.68?2:3;
    p.bucket=Math.min(2,Math.floor(p.r*3));
    p.group=p.tone*3+p.bucket;
  }
  // Physical separation: board rendered first, skater on top.
  points=boardPoints.concat(personPoints).sort((a,b)=>a.group-b.group);
  // Expose counts for local animation verification without changing the UI.
  scene.dataset.personParticles=personPoints.length;
  scene.dataset.boardParticles=boardPoints.length;
}
 function geometry(){
   // Contain the *entire* skater / deck / wheels, even on short laptop screens.
   // A little extra bottom clearance accommodates natural idle bobbing.
   const ratio=figure.height/figure.width;
   const margin=isMobile?16:Math.max(48,W*.062);
   const topSafe=isMobile?110:65;
   const bottomSafe=isMobile?92:105;
   const widthLimit=isMobile?W-2*margin:Math.min(W*.55,W-margin*2,780);
   const size=Math.max(100,Math.min(widthLimit,(H-topSafe-bottomSafe)/ratio));
   const h=size*ratio;
   const left=isMobile?(W-size)/2:Math.max(margin,W-margin-size);
   const top=isMobile
     ?Math.max(topSafe,Math.min(H*.31,H-h-bottomSafe))
     :Math.max(topSafe,Math.min((H-h)*.43,H-h-bottomSafe));
   return{left,top,w:size,h};
 }
let geo={left:0,top:0,w:0,h:0};
function resize(){if(!personFigure.complete||!personFigure.naturalWidth||!boardFigure.complete||!boardFigure.naturalWidth)return;
  W=window.innerWidth;H=window.innerHeight;dpr=Math.min(1.7,devicePixelRatio||1);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  geo=geometry();
  for(const p of points){p.x=geo.left+p.u*geo.w;p.y=geo.top+p.v*geo.h;p.vx=0;p.vy=0;}
  update();
}
function applyProgress(value){
  progress=clamp(value);
  // Keep the skater intact through the first part of the pinned panel;
  // disperse the particles gradually as the next panel rises over it.
  scrollScatter=reduced?0:smooth((progress-.40)/.60);
  const ex=smooth((progress-.12)/.62);
  hero.style.transform=`translate3d(${(-ex*115)}vw,0,0)`;
  hero.style.opacity=String(1-smooth((progress-.20)/.54));
  midcopy.style.transform=`translate3d(-50%,${(1-ex)*35}vh,0)`;
  midcopy.style.opacity=String(smooth((progress-.55)/.32));
  fill.style.width=(progress*100).toFixed(1)+'%';
  if(!frame)frame=requestAnimationFrame(render);
}
function update(){
  if(window.__particleScrollControlled)return;
  const travel=Math.max(1,stage.offsetHeight-H);
  applyProgress(reduced?0:clamp(-stage.getBoundingClientRect().top/travel));
}
window.addEventListener('particle:progress',event=>applyProgress(event.detail?.progress??0));
function drawFigure(t,scatter){
  const idleX=reduced?0:Math.sin(t*.77)*2.8*(1-scatter);
  const idleY=reduced?0:Math.sin(t*1.36)*5.8*(1-scatter);
  // Independent pale skateboard under the person, so no dark crop of the
  // skater can be accidentally drawn over the deck or its wheels.
  ctx.save();
  // Match the person's faint tonal anchor: source bitmap lightness must not
  // tint the independently moving skateboard dots or create a pale grey slab.
  ctx.globalAlpha=(reduced?.055:isMobile?.022:.018)*(1-scatter)*(1-.78*pointer.speed);
  ctx.drawImage(boardFigure,geo.left+idleX,geo.top+idleY,geo.w,geo.h);
  ctx.restore();
  // The person is rendered independently in its original dark palette.
  ctx.save();
  ctx.globalAlpha=(reduced?.28:isMobile?.09:.07)*(1-scatter)*(1-.80*pointer.speed);
  ctx.drawImage(personFigure,geo.left+idleX,geo.top+idleY,geo.w,geo.h);
  ctx.restore();
  // Localized finger contour reinforcement, strictly from the person layer.
  ctx.save();ctx.globalAlpha=(reduced?.28:.19)*(1-scatter)*(1-.65*pointer.speed);
  const bx=0,by=112,bw=159,bh=114;
  ctx.drawImage(personFigure,bx,by,bw,bh,
    geo.left+idleX+(bx/personFigure.width)*geo.w,
    geo.top+idleY+(by/personFigure.height)*geo.h,
    geo.w*(bw/personFigure.width),geo.h*(bh/personFigure.height));
  ctx.restore();
  // One draw call for each ink particle: movement persists after cursor stops
  // and springs back to the hand-drawn reference contour.
  const radius=isMobile?144:187;const rr=radius*radius;
  const influenceSpeed=pointer.speed;
  let lastGroup=-1;
  for(let i=0;i<points.length;i++){
    const p=points[i];
    const fx=geo.left+p.u*geo.w+idleX+Math.sin(t*(1.2+p.r*.65)+p.phase)*(reduced?0:1.35+p.r*1.45);
    const fy=geo.top+p.v*geo.h+idleY+Math.cos(t*(.89+p.r*.55)+p.phase)*(reduced?0:1.8+p.r*1.1);
    const scatterPower=scatter*scatter;
    const desiredX=fx+(p.dx*W*.78)*scatterPower;
    const desiredY=fy+(p.dy*H*.83)*scatterPower;
    if(p.x===null){p.x=fx;p.y=fy;}
    const differenceX=desiredX-p.x,differenceY=desiredY-p.y;
    if(!reduced){
      // Soft spring + damping: particle positions are independent state.
      p.vx=(p.vx+differenceX*.030)*.900;
      p.vy=(p.vy+differenceY*.030)*.900;
      if(influenceSpeed>.02&&scatter<.92){
        const relX=p.x-pointer.x,relY=p.y-pointer.y;
        const d2=relX*relX+relY*relY;
        if(d2<rr*3.4){
          const falloff=Math.exp(-d2/(rr*.64));
          const amt=falloff*influenceSpeed*(1-scatter)*.62;
          // Pull along travel direction and fan out into a visible flow trail.
          p.vx+=pointer.dx*.19*amt+(-relY/radius)*2.5*amt;
          p.vy+=pointer.dy*.19*amt+(relX/radius)*2.5*amt;
          p.trail=Math.min(1,p.trail+.12*amt);
        }
      }
      p.x+=p.vx;p.y+=p.vy;
      p.trail*=.962;
    }else{p.x=desiredX;p.y=desiredY;}
    if(p.x<0||p.x>W||p.y<0||p.y>H)continue;
    if(p.group!==lastGroup){
      // Identical ink and opacity for BOTH the skateboard and the person.
      // Layer identity never enters the particle color computation.
      const colors=[58,84,116,151];
      const bases=[.92,.82,.70,.52];
      const a=bases[p.tone]*(1-scatter*.975)*(.82+p.bucket*.09);
      const c=colors[p.tone];ctx.fillStyle=`rgba(${c},${c},${c},${a})`;
      lastGroup=p.group;
    }
    // The two layers now share the same apparent dot scale. Smaller wheel/
    // finger grains preserve contour detail without a change in ink color.
    const commonSize=(p.size>.90?2.4:p.size>.45?1.85:1.42)*(isMobile?.87:1);
    const sz=p.hand?commonSize*.68:p.wheel?commonSize*.88:commonSize;
    ctx.fillRect(p.x,p.y,sz,sz);
    // Flowing motion draws a short streak only while a particle is displaced.
    if(p.trail>.28){ctx.strokeStyle=`rgba(84,84,84,${(.09*p.trail).toFixed(3)})`;ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.4,p.y-p.vy*1.4);ctx.stroke();}
  }
}
 function drawFlowEchoes(t){
   // Ripple-like comic rings, no harsh strobes and no permanent marks.
   ctx.save();
   for(let i=hoverEchoes.length-1;i>=0;i--){
     const e=hoverEchoes[i];e.life*=.951;
     if(e.life<.035){hoverEchoes.splice(i,1);continue;}
     const age=1-e.life;
     ctx.strokeStyle=`rgba(30,30,28,${(.12*e.life).toFixed(3)})`;
     ctx.lineWidth=1.1*e.life+.2;
     ctx.beginPath();ctx.arc(e.x,e.y,12+age*48+e.power*7,0,6.283);ctx.stroke();
     for(let k=0;k<4;k++){
       const a=t*.55+e.seed+k*1.571;
       const r=20+age*35;
       ctx.fillStyle=`rgba(34,34,32,${(.28*e.life).toFixed(3)})`;
       ctx.beginPath();ctx.arc(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r,1.3+e.power*.6,0,6.283);ctx.fill();
     }
   }
   ctx.restore();
 }
 function render(stamp=0){frame=0;if(document.hidden||!visible||!personFigure.naturalWidth||!boardFigure.naturalWidth)return;
  const t=stamp*.001;ctx.clearRect(0,0,W,H);
  if(scrollScatter>.01){bg.style.opacity=String(1-scrollScatter*.55);}else{bg.style.opacity='1';}
  // Pointer influence decays even if the pointer stops inside the scene.
  pointer.speed*=.90;pointer.dx*=.90;pointer.dy*=.90;
     drawFigure(t,scrollScatter);
   if(!reduced)drawFlowEchoes(t);
  if(!reduced&&scrollScatter<.995)frame=requestAnimationFrame(render);
}
function pointerMove(e){if(reduced||!personFigure.naturalWidth||!boardFigure.naturalWidth)return;
  const rect=scene.getBoundingClientRect();if(e.clientY<rect.top||e.clientY>rect.bottom)return;
  const now=performance.now(),x=e.clientX,y=e.clientY;
  if(pointer.on){
    const totalDX=x-pointer.lastX,totalDY=y-pointer.lastY;
    const distance=Math.hypot(totalDX,totalDY);
    // Impulses apply along the entire cursor trail, including intermediate
    // pointer events between animation frames; the spring then regroups them.
    if(distance>1.4 && distance<260 && progress<.90){
      const radius=isMobile?128:180,r2=radius*radius;
      const xA=pointer.lastX,yA=pointer.lastY,seg2=distance*distance;
      const intensity=clamp(distance/27,.22,1.15);
      for(const p of points){
        if(p.x===null)continue;
        const ratio=clamp(((p.x-xA)*totalDX+(p.y-yA)*totalDY)/seg2);
        const nearX=xA+ratio*totalDX,nearY=yA+ratio*totalDY;
        const px=p.x-nearX,py=p.y-nearY,d2=px*px+py*py;
        if(d2>=r2)continue;
        const f=Math.pow(1-d2/r2,2.2)*intensity*(1-scrollScatter);
        p.vx+=(totalDX*.20-py*.014)*f;
        p.vy+=(totalDY*.20+px*.014)*f;
        p.x+=totalDX*.045*f;p.y+=totalDY*.045*f;
        p.trail=Math.min(1,p.trail+f*.23);
      }
    }
    const elapsed=Math.max(10,Math.min(85,now-pointer.t));const dt=16.7/elapsed;
    pointer.dx=clamp((x-pointer.lastX)*dt,-70,70);
    pointer.dy=clamp((y-pointer.lastY)*dt,-70,70);
    const magnitude=Math.hypot(pointer.dx,pointer.dy);
         pointer.speed=clamp(magnitude/24,0,1);
     if(magnitude>2.5&&now-lastEchoTime>58&&progress<.90){
       hoverEchoes.push({x,y,life:.8,power:clamp(magnitude/37,0,1),seed:now*.001});
       if(hoverEchoes.length>15)hoverEchoes.shift();lastEchoTime=now;
     }
  }
  pointer.x=x;pointer.y=y;pointer.lastX=x;pointer.lastY=y;pointer.t=now;pointer.on=true;
  bg.style.setProperty('--bgx',`${clamp((x/W-.5)*-13,-7,7)}px`);bg.style.setProperty('--bgy',`${clamp((y/H-.5)*-9,-5,5)}px`);
}

// GSAP Physics2D-style explosion: randomized angle & velocity, real gravity,
// damping/bounce and fade. Uses a self-contained canvas so the downloadable
// HTML never needs a CDN or an extra Physics2DPlugin file.
const popEmitter=document.getElementById('popEmitter');
const popCanvas=document.getElementById('popPhysics');
const popCtx=popCanvas.getContext('2d',{alpha:true});
let popDots=[],popRings=[],popFrame=0,popLast=0,popDpr=1;
function sizePopCanvas(){
  const rect=scene.getBoundingClientRect();
  popDpr=Math.min(1.7,devicePixelRatio||1);
  popCanvas.width=Math.round(rect.width*popDpr);
  popCanvas.height=Math.round(rect.height*popDpr);
  popCtx.setTransform(popDpr,0,0,popDpr,0,0);
}
function firePhysicsPop(){
  const a=popEmitter.getBoundingClientRect(),b=scene.getBoundingClientRect();
  const x=a.left-b.left+a.width/2,y=a.top-b.top+a.height/2;
  // Repeating clicks are allowed but old sprites are bounded for performance.
  const amount=reduced?12:52;
  for(let i=0;i<amount;i++){
    const angle=Math.random()*Math.PI*2;
    const power=125+Math.random()*330;
    const scatter=Math.random()*23;
    const life=(reduced?.45:1.45+Math.random()*.65);
    popDots.push({x:x+Math.cos(angle)*scatter,y:y+Math.sin(angle)*scatter,
      vx:Math.cos(angle)*power,vy:Math.sin(angle)*power-95,
      gravity:reduced?0:500+Math.random()*400,drag:.997,
      size:2.5+Math.random()*6.5,age:0,life,
      shape:i%7===0?'diamond':i%4===0?'square':'circle',
      ink:['#2c2b29','#75726e','#b6a599','#e17655','#57534f'][i%5],
      spin:(Math.random()-.5)*7,rotation:Math.random()*6.28});
  }
  if(popDots.length>220)popDots.splice(0,popDots.length-220);
  popRings.push({x,y,age:0,life:reduced?.32:.7});
  // The emitter springs and settles without changing its layout position.
  popEmitter.classList.remove('is-popping');
  void popEmitter.offsetWidth;
  popEmitter.classList.add('is-popping');
  if(!popFrame){popLast=0;popFrame=requestAnimationFrame(renderPhysicsPop);}
}
function renderPhysicsPop(now){
  popFrame=0;
  if(document.hidden){popDots=[];popRings=[];return;}
  const w=popCanvas.width/popDpr,h=popCanvas.height/popDpr;
  const dt=popLast?Math.min(.032,(now-popLast)/1000):.016;
  popLast=now;
  popCtx.clearRect(0,0,w,h);
  for(let i=popDots.length-1;i>=0;i--){
    const p=popDots[i];p.age+=dt;
    if(p.age>=p.life){popDots.splice(i,1);continue;}
    p.vy+=p.gravity*dt;p.vx*=Math.pow(p.drag,dt*60);
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    // Small floor bounce, like the referenced physics explosion.
    const floor=h-10;
    if(p.y>floor && p.vy>0){p.y=floor;p.vy*=-.33;p.vx*=.74;}
    p.rotation+=p.spin*dt;
    const fade=Math.min(1,(p.life-p.age)/.48),intro=Math.min(1,p.age/.07);
    popCtx.globalAlpha=fade*intro*.95;
    popCtx.fillStyle=p.ink;
    popCtx.save();popCtx.translate(p.x,p.y);popCtx.rotate(p.rotation);
    if(p.shape==='square')popCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    else if(p.shape==='diamond'){
      popCtx.beginPath();popCtx.moveTo(0,-p.size);popCtx.lineTo(p.size*.6,0);
      popCtx.lineTo(0,p.size);popCtx.lineTo(-p.size*.6,0);popCtx.closePath();popCtx.fill();
    }else{popCtx.beginPath();popCtx.arc(0,0,p.size*.5,0,Math.PI*2);popCtx.fill();}
    popCtx.restore();
  }
  for(let i=popRings.length-1;i>=0;i--){
    const ring=popRings[i];ring.age+=dt;
    if(ring.age>ring.life){popRings.splice(i,1);continue;}
    const t=ring.age/ring.life;
    popCtx.globalAlpha=(1-t)*.43;popCtx.lineWidth=2.1*(1-t)+.35;
    popCtx.strokeStyle='#31302e';popCtx.beginPath();
    popCtx.arc(ring.x,ring.y,18+t*(reduced?36:98),0,Math.PI*2);popCtx.stroke();
  }
  popCtx.globalAlpha=1;
  if(popDots.length||popRings.length)popFrame=requestAnimationFrame(renderPhysicsPop);
  else popLast=0;
}
popEmitter.addEventListener('click',firePhysicsPop);
window.addEventListener('resize',sizePopCanvas,{passive:true});
sizePopCanvas();

function pointerLeave(){pointer.on=false;pointer.speed=0;pointer.dx=0;pointer.dy=0;}
window.addEventListener('pointermove',pointerMove,{passive:true});scene.addEventListener('pointerleave',pointerLeave,{passive:true});
window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});
if('IntersectionObserver'in window){new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible)update();},{threshold:0}).observe(scene);}
})();
</script>
